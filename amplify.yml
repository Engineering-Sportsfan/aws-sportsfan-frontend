version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - env | grep -e NEXTAUTH_ >> .env.production
        - env | grep -e AUTH_ >> .env.production
        - env | grep -e JWT_ >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
